[package]
name = "weave-updater"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Weave Office update checks: GitHub Releases, signed checksums, in-place install"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
# Already in the application through PDF signing: no new crypto code in the binary.
sha2 = "0.11"
ed25519-dalek = "3"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
# HTTPS with the operating system's trust store and proxy settings.
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "platform-verifier", "win-system-proxy"] }

[dev-dependencies]
# Key generation for the release-signing example.
getrandom = "0.4"
tempfile = "3"
