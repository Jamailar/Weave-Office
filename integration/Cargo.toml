[package]
name = "weave-office-integration"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1"
tempfile = "3"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.16"
wordcraft-ui-egui = { path = "../vendor/wordcraft/crates/ui-egui" }
