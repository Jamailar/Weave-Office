# Vendored copy of winprint 0.2.1 (storytold/winprint.rs, rev 5f80b9baf6b58937c401656634e42d33f00ddf49,
# BSD-3-Clause, see LICENSE.md), patched in through the root Cargo.toml. See README.md for the change.
# The upstream build script (PDFium download for the off-by-default `pdfium` feature), tests,
# examples and test data are left out; the `pdfium` feature is not supported in this copy.
[package]
edition = "2021"
name = "winprint"
version = "0.2.1"
authors = ["ArcticLampyrid <ArcticLampyrid@outlook.com>"]
description = "A crate for printing to a Windows printer device using Windows API"
license = "BSD-3-Clause"
repository = "https://github.com/ArcticLampyrid/winprint.rs/"
publish = false

[dependencies]
scopeguard = "1.2"
sha2 = { version = "0.11", optional = true }
bs58 = { version = "0.5", optional = true }
uuid = { version = "1.23", features = ["v4"], optional = true }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"
fmt-derive = "0.1"
xml = "1.2"
windows-core = "0.62"
windows-implement = "0.60.2"

[dependencies.windows]
version = "0.62"
features = [
    "Data_Pdf",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Imaging_D2D",
    "Win32_Graphics_Printing",
    "Win32_Graphics_Printing_PrintTicket",
    "Win32_Security",
    "Win32_Storage_Xps_Printing",
    "Win32_System_Com",
    # Weave Office: PdfCreateRenderer is looked up at run time (src/printer/win_pdf.rs).
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT_Pdf",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[features]
default = []
# Kept so the upstream sources compile unchanged; needs the upstream build script, so leave it off.
pdfium = []
test-utils = ["dep:sha2", "dep:bs58", "dep:uuid"]

[lints.rust]
# Upstream helpers used only by the `pdfium` printer, which this copy leaves off.
dead_code = "allow"
