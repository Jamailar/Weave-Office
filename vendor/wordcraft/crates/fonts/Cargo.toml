[package]
name = "wordcraft-fonts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft fonts: font database (bundled OFL + system), metrics, glyph outlines, shaping"

[lints]
workspace = true

[dependencies]
kurbo = { workspace = true }
skrifa = { workspace = true }
harfrust = { workspace = true }
wuff = { workspace = true }
brotli-decompressor = { workspace = true }
unicode-bidi = { workspace = true }
unicode-script = { workspace = true }
log = { workspace = true }
weave-font-assets = { path = "../../../../crates/font-assets", optional = true }
weave-system-fonts = { path = "../../../../crates/system-fonts", optional = true }

[features]
shared-font-assets = ["dep:weave-font-assets"]
# An embedding host's one scan of the installed fonts, instead of this crate's own.
shared-system-fonts = ["dep:weave-system-fonts"]
