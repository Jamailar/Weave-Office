[package]
name = "wordcraft-metafile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft metafiles: parses Windows WMF and EMF records into a neutral vector model (paths and bitmaps)"

[lints]
workspace = true

[dependencies]
kurbo = { workspace = true }
thiserror = { workspace = true }
# Presentation's reader, shared by an embedding host instead of this crate's own.
deckcraft-metafile = { path = "../../../deckcraft/crates/metafile", optional = true }

[features]
shared-metafile = ["dep:deckcraft-metafile"]
