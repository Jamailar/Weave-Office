<!doctype html><html><head><meta charset="utf-8">
<!-- Renders the README banner / GitHub social preview. Open with ?lang=en or ?lang=zh-CN at a
     1280×640 viewport and screenshot once fonts have loaded. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:640px;overflow:hidden;font-family:Inter,"Noto Sans SC",sans-serif;color:#1d2330;
background:radial-gradient(900px 500px at 0% 0%,#eef4ff 0%,transparent 60%),radial-gradient(700px 520px at 100% 100%,#eaf7f1 0%,transparent 60%),#f7f8fa;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(#e7eaf0 1px,transparent 1px),linear-gradient(90deg,#e7eaf0 1px,transparent 1px);background-size:32px 32px;opacity:.5;mask-image:linear-gradient(90deg,#000 0%,transparent 55%)}
.left{position:absolute;left:72px;top:64px;width:580px}
.brand{display:flex;align-items:center;gap:20px}
.icon{width:88px;height:88px;border-radius:21px;overflow:hidden;box-shadow:0 10px 30px rgba(30,40,70,.18),0 0 0 1px rgba(0,0,0,.05)}
.icon img{width:100%;height:100%;object-fit:cover;transform:scale(1.12)}
h1{font-weight:800;font-size:52px;letter-spacing:-1.5px;line-height:1}
.oss{display:inline-block;margin-top:9px;font:600 14px Inter;color:#1a7f5a;background:#e3f5ec;border-radius:999px;padding:4px 12px;letter-spacing:.3px}
.tag{margin-top:34px;font-weight:800;font-size:40px;letter-spacing:-.8px;line-height:1.2}
.zh .tag{font-family:"Noto Sans SC";font-weight:900;letter-spacing:1px;font-size:42px}
.tag em{font-style:normal;background:linear-gradient(90deg,#2f6bff,#16a37a 50%,#7c5cff);-webkit-background-clip:text;color:transparent}
.pts{margin-top:30px;display:flex;flex-direction:column;gap:16px}
.pt{display:flex;gap:16px;align-items:flex-start;background:rgba(255,255,255,.85);border:1px solid #e3e7ee;border-radius:14px;padding:16px 18px}
.badge{flex:none;width:44px;height:44px;border-radius:11px;display:grid;place-items:center;color:#fff;font:800 20px Inter}
.pt h3{font-size:20px;font-weight:700;margin-bottom:6px}
.zh .pt h3{font-family:"Noto Sans SC"}
.pt p{font-size:15px;color:#535b6c;line-height:1.5}
.zh .pt p{font-family:"Noto Sans SC";font-size:15.5px}
.dots{display:flex;gap:4px;margin-top:9px;flex-wrap:wrap}
.dots span{font:600 11.5px Inter,"Noto Sans SC";padding:3px 7px;border-radius:6px;background:#f2f4f7;color:#3b4252;display:flex;align-items:center;gap:5px}
.dots i{width:7px;height:7px;border-radius:2px}
code{font:600 14px "JetBrains Mono";background:#eef0f4;padding:1px 6px;border-radius:5px;color:#1d2330}
/* window */
.win{position:absolute;right:52px;top:56px;width:560px;height:350px;background:#fff;border-radius:16px;box-shadow:0 30px 70px rgba(30,40,70,.16),0 0 0 1px rgba(0,0,0,.06);overflow:hidden}
.bar{height:42px;background:#eef0f3;display:flex;align-items:flex-end;position:relative}
.lights{position:absolute;left:16px;top:15px;display:flex;gap:7px}.lights b{width:12px;height:12px;border-radius:50%}
.tabs{margin-left:84px;display:flex;gap:2px}
.t{height:31px;padding:0 9px;border-radius:8px 8px 0 0;font:500 12px Inter,"Noto Sans SC";color:#5b6273;display:flex;align-items:center;gap:6px;white-space:nowrap}
.t.on{background:#fff;color:#1d2330}
.t i{width:9px;height:11px;border-radius:2px}
.rib{height:36px;border-bottom:1px solid #eceef2;display:flex;align-items:center;gap:16px;padding:0 18px;font:500 12px Inter,"Noto Sans SC";color:#6b7385}
.rib .a{color:#1d2330;font-weight:700;border-bottom:2px solid #16a37a;padding-bottom:8px;margin-top:10px}
.sheet{display:grid;grid-template-columns:36px repeat(4,1fr);font:500 12.5px Inter,"Noto Sans SC";color:#3b4252}
.sheet div{height:30px;border-right:1px solid #eef0f3;border-bottom:1px solid #eef0f3;display:flex;align-items:center;padding:0 9px}
.sheet .h{background:#f6f7f9;color:#8a93a6;justify-content:center;font-weight:600}
.sheet .n{justify-content:flex-end}
.sheet .sel{outline:2px solid #16a37a;outline-offset:-2px;background:#e9f8f1;font-weight:700;color:#0f7a55}
/* terminal */
.term{position:absolute;right:52px;bottom:34px;width:560px;background:#151a24;border-radius:14px;box-shadow:0 24px 50px rgba(20,25,40,.38);overflow:hidden}
.tbar{height:30px;background:#1f2533;display:flex;align-items:center;padding:0 12px;gap:6px;font:600 11.5px Inter,"Noto Sans SC";color:#8a93a6}
.tbar b{width:9px;height:9px;border-radius:50%;background:#3a4152}
.tbar span{margin-left:8px}
.tb{padding:12px 16px 14px;font:500 12.5px "JetBrains Mono","Noto Sans SC";color:#d8dee9;line-height:1.7}
.ai{color:#b9a6ff}.p{color:#7ee2b0}.g{color:#7f889b}.ok{color:#7ee2b0}
</style></head><body><div class="grid"></div>
<div class="left">
 <div class="brand"><div class="icon"><img src="../app-icon/weave-office.png"></div><div><h1>Weave Office</h1><span class="oss" data-k="oss"></span></div></div>
 <div class="tag" data-k="tag"></div>
 <div class="pts">
  <div class="pt"><div class="badge" style="background:linear-gradient(135deg,#2f6bff,#16a37a)">7</div><div><h3 data-k="h1"></h3><p data-k="p1"></p>
   <div class="dots" id="kinds"></div></div></div>
  <div class="pt"><div class="badge" style="background:linear-gradient(135deg,#7c5cff,#d94f9a)">AI</div><div><h3 data-k="h2"></h3><p data-k="p2"></p></div></div>
 </div>
</div>
<div class="win">
 <div class="bar"><div class="lights"><b style="background:#ff5f57"></b><b style="background:#febc2e"></b><b style="background:#28c840"></b></div>
  <div class="tabs" id="tabs"></div></div>
 <div class="rib" id="rib"></div>
 <div class="sheet" id="sheet"></div>
</div>
<div class="term"><div class="tbar"><b></b><b></b><b></b><span data-k="term"></span></div><div class="tb" id="tb"></div></div>
<script>
const T={
 en:{oss:"OPEN SOURCE · RUST",tag:"One app for every document.<br><em>Built for AI agents.</em>",
  h1:"All-in-one",p1:"Docs, sheets, slides, PDF, Markdown, code and rich text, all in one window and one row of tabs.",
  h2:"AI-friendly",p2:"The app is also a CLI. Agents call <code>weave-office</code> directly to create, read, edit and export files, with JSON output.",
  kinds:["Docs","Sheets","Slides","PDF","Markdown","Code","Rich text"],
  tabs:["quote.xlsx","deal.docx","pitch.pptx","invoice.pdf","notes.md"],rib:["Home","Insert","Formulas","Data","View"],
  head:["Item","Qty","Price","Total"],rows:[["Design","2","640","1,280"],["Build","5","900","4,500"],["Review","1","320","320"],["Total","","","6,100"]],
  term:"AI agent · terminal",
  lines:['<span class="ai">● agent</span> <span class="g">Update the quote and send a PDF</span>',
   '<span class="p">$</span> weave-office set quote.xlsx /Sheet1/D2 value=1280 --json',
   '<span class="ok">{"ok":true,"data":{"path":"/Sheet1/D2","node":{…},"commands":[…]}}</span>',
   '<span class="p">$</span> weave-office export quote.xlsx quote.pdf --json',
   '<span class="ok">{"ok":true,"data":{"output":"quote.pdf",…}}</span>']},
 "zh-CN":{oss:"开源 · RUST",tag:"一个应用，打开所有文档<br><em>AI 可以直接调用</em>",
  h1:"多合一",p1:"文字、表格、演示、PDF、Markdown、代码与富文本，同一个窗口、同一条文件标签栏。",
  h2:"AI 友好",p2:"应用本身就是命令行工具。AI 代理直接调用 <code>weave-office</code> 新建、读取、修改、导出文档，输出 JSON。",
  kinds:["文字","表格","演示","PDF","Markdown","代码","富文本"],
  tabs:["报价.xlsx","合同.docx","路演.pptx","发票.pdf","笔记.md"],rib:["开始","插入","公式","数据","视图"],
  head:["项目","数量","单价","金额"],rows:[["设计","2","640","1,280"],["开发","5","900","4,500"],["评审","1","320","320"],["合计","","","6,100"]],
  term:"AI 代理 · 终端",
  lines:['<span class="ai">● agent</span> <span class="g">更新报价表并导出 PDF</span>',
   '<span class="p">$</span> weave-office set 报价.xlsx /Sheet1/D2 value=1280 --json',
   '<span class="ok">{"ok":true,"data":{"path":"/Sheet1/D2","node":{…},"commands":[…]}}</span>',
   '<span class="p">$</span> weave-office export 报价.xlsx 报价.pdf --json',
   '<span class="ok">{"ok":true,"data":{"output":"报价.pdf",…}}</span>']}};
const lang=new URLSearchParams(location.search).get("lang")||"en",L=T[lang]||T.en;
document.documentElement.lang=lang;if(lang.startsWith("zh"))document.body.classList.add("zh");
document.querySelectorAll("[data-k]").forEach(e=>e.innerHTML=L[e.dataset.k]);
const C=["#2f6bff","#16a37a","#f08a24","#ec5a5a","#7c5cff","#3b4252","#d94f9a"];
kinds.innerHTML=L.kinds.map((k,i)=>`<span><i style="background:${C[i]}"></i>${k}</span>`).join("");
const tc=["#16a37a","#2f6bff","#f08a24","#ec5a5a","#7c5cff"];
tabs.innerHTML=L.tabs.map((t,i)=>`<div class="t${i?"":" on"}"><i style="background:${tc[i]}"></i>${t}</div>`).join("");
rib.innerHTML=L.rib.map((r,i)=>`<span${i?"":' class="a"'}>${r}</span>`).join("");
let s='<div class="h"></div>'+"ABCD".split("").map(c=>`<div class="h">${c}</div>`).join("");
s+='<div class="h">1</div>'+L.head.map(h=>`<div style="font-weight:700">${h}</div>`).join("");
L.rows.forEach((r,i)=>{s+=`<div class="h">${i+2}</div>`+r.map((v,j)=>`<div class="${j?"n":""}${i==0&&j==3?" sel":""}"${i==3?' style="font-weight:700"':""}>${v}</div>`).join("")});
sheet.innerHTML=s;
tb.innerHTML=L.lines.join("<br>");
</script></body></html>
